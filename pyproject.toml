[project]
name = "pallas-plugin-ai-media"
version = "4.3.16"
description = "Pallas-Bot 官方扩展：牛牛唱歌与牛牛说（TTS）。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<4.0"
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-adapter-onebot>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pallas_plugin_sing",
    "src/pallas_plugin_tts",
    "src/pallas_plugin_ai_media_runtime",
]

[project.entry-points."pallas.work_handlers"]
sing = "pallas_plugin_sing.work_handler:work_handlers"
tts = "pallas_plugin_tts.work_handler:work_handlers"

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = []
pallas-plugin-ai-media = ['pallas_plugin_sing', 'pallas_plugin_tts']

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-onebot = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
